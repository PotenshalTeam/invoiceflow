name: InvoiceFlow tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m py_compile plugins/invoiceflow/skills/invoice-workflow/scripts/invoiceflow.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
